<!DOCTYPE html>
<html>
<head>
<title>Leave Request</title>

<style>

body{
font-family:Arial;
background:#f2f4f7;
}

.container{
width:400px;
margin:80px auto;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:15px;
}

button{
background:#2980b9;
color:white;
padding:10px;
border:none;
width:100%;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Leave Request</h2>

<form method="post">
{% csrf_token %}

<label>From Date</label>
<input type="date" name="from_date" min="{{ today|date:'Y-m-d' }}" required>

<label>To Date</label>
<input type="date" name="to_date" min="{{ today|date:'Y-m-d' }}" required>

<label>Leave Type</label>
<select name="leave_type" required>
<option value="">Select Leave Type</option>
<option value="Sick">Sick Leave</option>
<option value="Casual">Casual Leave</option>
<option value="Emergency">Emergency Leave</option>
<option value="Personal">Personal Leave</option>
</select>

<br><br>

<label>Reason</label>
<textarea name="reason" rows="4" required></textarea>

<br><br>

<button type="submit">Submit Leave Request</button>

</form>

</div>

</body>
</html>
